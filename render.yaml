services:
  - type: redis
    name: finsa-redis
    plan: free
    ipAllowList: []

  - type: web
    name: finsa-backend
    runtime: node
    rootDir: packages/backend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: amazon.nova-lite-v1:0
      - key: API_KEY
        value: demo-key-finsa-2026
      - key: JSON_BODY_LIMIT
        value: 8mb
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: finsa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: finsa-redis
          property: connectionString
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: finsa-frontend
    runtime: static
    rootDir: packages/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_ADMIN_KEY
        sync: false

databases:
  - name: finsa-postgres
    plan: free
    ipAllowList: []
