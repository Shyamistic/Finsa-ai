services:
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    labels:
      - "app.name=finsa-ai"
      - "app.component=frontend"
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4000
    depends_on:
      - backend

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    labels:
      - "app.name=finsa-ai"
      - "app.component=backend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://lw:lw@postgres:5432/finsa
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lw
      POSTGRES_PASSWORD: lw
      POSTGRES_DB: finsa
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lw -d finsa']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3001:3000'
    volumes:
      - ./grafana:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
  grafana_data:
